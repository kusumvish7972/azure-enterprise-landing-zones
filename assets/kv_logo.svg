<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="40%" stop-color="#101f42" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Glowing Cyan Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Metallic Letter Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0f6fc" />
      <stop offset="100%" stop-color="#c9d1d9" />
    </linearGradient>

    <!-- Filter for Glow Effect -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Dark Border with Shadow -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#060c1d" stroke-width="8" filter="url(#shadow)" />

  <!-- Outer Glowing Cyan Ring -->
  <circle cx="250" cy="250" r="228" fill="none" stroke="url(#ringGrad)" stroke-width="7" filter="url(#cyanGlow)" />

  <!-- Inner Dark Blue Radial/Linear Body -->
  <circle cx="250" cy="250" r="220" fill="url(#bgGrad)" />

  <!-- Decorative Inner Orbit Rings -->
  <circle cx="250" cy="250" r="200" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.35" />
  <circle cx="250" cy="250" r="185" fill="none" stroke="#1d4ed8" stroke-width="2" opacity="0.5" />

  <!-- Monogram Bold Letters "KV" -->
  <g transform="translate(250, 250)">
    <text 
      x="0" 
      y="68" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
      font-size="190" 
      font-weight="900" 
      letter-spacing="2" 
      text-anchor="middle" 
      fill="url(#textGrad)"
      filter="url(#shadow)"
    >KV</text>
  </g>

  <!-- Subtle Bottom Ambient Arc -->
  <path d="M 90 280 A 180 180 0 0 0 410 280" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.4" />
</svg>
