<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <!-- Standard Corporate Executive Gradient (Deep Midnight Navy to Rich Sapphire) -->
    <linearGradient id="corpNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b17" />
      <stop offset="35%" stop-color="#0b152d" />
      <stop offset="70%" stop-color="#102552" />
      <stop offset="100%" stop-color="#163675" />
    </linearGradient>

    <!-- Subtle Deep Wave Layer 1 -->
    <linearGradient id="darkWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#030712" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0b1736" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.3" />
    </linearGradient>

    <!-- Subtle Translucent Wave Layer 2 -->
    <linearGradient id="darkWave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#172554" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#1e40af" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.35" />
    </linearGradient>

    <!-- Crisp Platinum Silver Text Gradient -->
    <linearGradient id="platinumText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Soft Executive Text Shadow -->
    <filter id="execShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Clean Clip for Rounded Corners -->
    <clipPath id="bannerClip">
      <rect width="1200" height="280" rx="12" ry="12" />
    </clipPath>
  </defs>

  <!-- Main Container -->
  <g clip-path="url(#bannerClip)">
    <!-- Base Executive Navy Background -->
    <rect width="1200" height="280" fill="url(#corpNavyGrad)" />

    <!-- Ambient Subtle Radial Glow (Adds depth without being flashy) -->
    <circle cx="600" cy="140" r="350" fill="#1e3a8a" opacity="0.3" filter="blur(60px)" />
    <circle cx="1100" cy="80" r="200" fill="#0284c7" opacity="0.15" filter="blur(50px)" />

    <!-- Smooth Architectural Curves at Bottom -->
    <!-- Wave 1 (Deep Shadowed Wave) -->
    <path d="M 0 235 C 300 270, 600 215, 880 250 C 1020 268, 1120 240, 1200 248 L 1200 280 L 0 280 Z" fill="url(#darkWave1)" />

    <!-- Wave 2 (Subtle Translucent Edge) -->
    <path d="M 0 258 C 260 225, 580 270, 920 238 C 1050 224, 1140 252, 1200 260 L 1200 280 L 0 280 Z" fill="url(#darkWave2)" />

    <!-- Pure, Standard, Executive Name -->
    <text 
      x="600" 
      y="155" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-size="50" 
      font-weight="800" 
      letter-spacing="2" 
      fill="url(#platinumText)" 
      text-anchor="middle"
      filter="url(#execShadow)"
    >KUSUM VISHWAKARMA</text>
  </g>
</svg>
